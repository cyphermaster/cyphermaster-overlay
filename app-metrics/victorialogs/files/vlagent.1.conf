VLAGENT_BIN="/opt/victorialogs/bin/vlagent"
VLAGENT_USER="victoria-logs"
VLAGENT_GROUP="victoria-logs"
# repeat -remoteWrite.url in VLAGENT_OPTS for additional targets
VLAGENT_REMOTE_WRITE="http://127.0.0.1:9428/insert/native"
VLAGENT_DATA="/var/lib/victoria-logs/vlagent-data"
VLAGENT_LISTEN=":9429"
# glob of log files to collect (empty = disabled), e.g. "/var/log/nginx/*.log"
# repeat -fileCollector.glob in VLAGENT_OPTS for additional patterns
# do not match VLAGENT_LOGFILE, vlagent would collect its own logs
VLAGENT_FILES=""
#  -remoteWrite.maxDiskUsagePerURL=1GB -fileCollector.excludeGlob=... -loggerLevel=WARN
VLAGENT_OPTS=""
VLAGENT_LOGFILE="/var/log/vlagent.log"
VLAGENT_NOFILE=65536
