VMALERT_BIN="/opt/victoriametrics/bin/vmalert"
VMALERT_USER="victoria-metrics"
VMALERT_GROUP="victoria-metrics"
# glob patterns are supported
VMALERT_RULES="/etc/victoria-metrics/vmalert/*.yml"
VMALERT_DATASOURCE="http://127.0.0.1:8428"
VMALERT_LISTEN=":8880"
# alertmanager, e.g. http://127.0.0.1:9093 (empty = alerts are only evaluated)
VMALERT_NOTIFIER=""
# persist recording rules results and alert states
#  -remoteWrite.url=http://127.0.0.1:8428 -remoteRead.url=http://127.0.0.1:8428
#  -evaluationInterval=1m -external.url=http://grafana.example.org
VMALERT_OPTS=""
VMALERT_LOGFILE="/var/log/vmalert.log"
VMALERT_NOFILE=65536
