# vmagent scrape configuration (Prometheus compatible)
# https://docs.victoriametrics.com/victoriametrics/vmagent/
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: vmagent
    static_configs:
      - targets: ["127.0.0.1:8429"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["127.0.0.1:8428"]

#  - job_name: node
#    static_configs:
#      - targets: ["127.0.0.1:9100"]
