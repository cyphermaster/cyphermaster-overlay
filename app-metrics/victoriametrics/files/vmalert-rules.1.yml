# vmalert rules (Prometheus compatible)
# https://docs.victoriametrics.com/victoriametrics/vmalert/
groups:
  - name: availability
    interval: 1m
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
